<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SWING.AI</title>
<link rel="stylesheet" href="css/style.css">
<style>
#cam-layer{display:none;position:fixed;inset:0;flex-direction:column;z-index:0;background:#010409}
#cam-layer.visible{display:flex}
#screen-setup,#screen-results{background:#0d1117;z-index:20}
#screen-framing,#screen-recording{position:fixed;inset:0;pointer-events:none}
#screen-framing.active,#screen-recording.active{pointer-events:auto}
.cam-bottom,.rec-bottom{pointer-events:auto}
</style>
</head>
<body>

<!-- Shared camera layer -->
<div id="cam-layer">
  <div style="flex:1;position:relative;overflow:hidden">
    <video id="vid" autoplay muted playsinline style="position:absolute;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none"></video>
    <canvas id="overlay" style="position:absolute;top:0;left:0;width:100%;height:100%"></canvas>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none">
      <div id="countdown-num" style="font-size:96px;font-weight:700;color:#58d678;opacity:.9;display:none;text-shadow:0 2px 24px rgba(0,0,0,.6)"></div>
    </div>
  </div>
</div>

<!-- SETUP -->
<div class="screen active" id="screen-setup">
  <div class="hdr"><span class="hdr-logo">SWING.AI</span><span class="hdr-sub">Phase 1</span></div>
  <div class="setup-body">
    <div class="setup-sec">
      <div class="setup-label">今日の悩み</div>
      <div class="tag-grid" id="tag-grid"></div>
    </div>
    <div class="setup-sec">
      <div class="setup-label">カメラアングル</div>
      <div class="angle-row">
        <button class="angle-btn active" data-angle="front">正面<br><small>飛球線後方</small></button>
        <button class="angle-btn" data-angle="side">側面<br><small>打席右側</small></button>
      </div>
    </div>
    <div class="setup-sec">
      <div class="setup-label">録画開始までの待機時間</div>
      <div class="delay-row">
        <button class="delay-btn" data-delay="3">3秒</button>
        <button class="delay-btn active" data-delay="5">5秒</button>
        <button class="delay-btn" data-delay="10">10秒</button>
      </div>
    </div>
    <div class="note">📌 三脚にスマホを固定し全身が映るよう調整してください。<br>計測項目：P1 頭部安定 / P2 ラテラルスウェイ / P3 脊柱角度 / P9 フォローバランス</div>
    <button class="btn-primary" id="btn-to-camera">カメラを起動する →</button>
  </div>
</div>

<!-- FRAMING -->
<div class="screen" id="screen-framing" style="flex-direction:column">
  <div class="hdr" style="background:rgba(22,27,34,.95)">
    <span class="hdr-logo">SWING.AI</span><span class="hdr-sub">フレーミング</span>
    <span class="hdr-badge" id="cam-info">—</span>
  </div>
  <div style="flex:1"></div>
  <div class="cam-bottom">
    <div class="cam-info-row">
      <span id="perf-badge">— fps</span>
      <span style="font-size:11px;color:#8b949e">全身が映るよう調整</span>
    </div>
    <div id="frame-banner" style="font-size:14px;font-weight:500;text-align:center;color:#e3b341;padding:4px 0">人物が映るよう調整してください</div>
    <button class="btn-primary" id="btn-frame-ok" disabled style="margin-top:0">フレーミングOK → 待機開始</button>
  </div>
</div>

<!-- RECORDING -->
<div class="screen" id="screen-recording" style="flex-direction:column">
  <div class="hdr" style="background:rgba(22,27,34,.92)">
    <span class="hdr-logo">SWING.AI</span>
    <span class="hdr-sub" id="rec-phase-label">録画準備中</span>
  </div>
  <div style="flex:1"></div>
  <div class="rec-bottom">
    <div id="rec-status" style="font-size:14px;color:#9ecfaa;text-align:center;margin-bottom:8px;font-weight:500">待機中...</div>
    <button class="btn-secondary" id="btn-cancel-rec">キャンセル</button>
  </div>
</div>

<!-- RESULTS -->
<div class="screen" id="screen-results" style="z-index:30">
  <div class="hdr"><span class="hdr-logo">SWING.AI</span><span class="hdr-sub">解析結果</span></div>
  <div class="results-body">

    <div class="phase-strip">
      <div class="phase-thumb" data-phase="address">
        <div class="thumb-fig"><img class="thumb-img" alt=""><div class="thumb-dot"></div></div>
        <div class="thumb-name">アドレス</div>
      </div>
      <div class="phase-thumb" data-phase="backswing">
        <div class="thumb-fig"><img class="thumb-img" alt=""><div class="thumb-dot"></div></div>
        <div class="thumb-name">テイク<br>バック</div>
      </div>
      <div class="phase-thumb" data-phase="top">
        <div class="thumb-fig"><img class="thumb-img" alt=""><div class="thumb-dot"></div></div>
        <div class="thumb-name">トップ</div>
      </div>
      <div class="phase-thumb" data-phase="downswing">
        <div class="thumb-fig"><img class="thumb-img" alt=""><div class="thumb-dot"></div></div>
        <div class="thumb-name">インパクト</div>
      </div>
      <div class="phase-thumb" data-phase="follow">
        <div class="thumb-fig"><img class="thumb-img" alt=""><div class="thumb-dot"></div></div>
        <div class="thumb-name">フォロー</div>
      </div>
    </div>

    <div class="viewer-wrap">
      <div style="padding:6px 12px 2px;display:flex;justify-content:space-between">
        <span id="viewer-phase-label" style="font-size:10px;color:#9ecfaa;letter-spacing:.05em">—</span>
        <span id="viewer-frame-num" style="font-size:10px;color:#3d6347">0/0</span>
      </div>
      <div style="padding:0 10px 4px">
        <input type="range" id="scrubber" min="0" max="0" value="0" style="width:100%;accent-color:#5ecb7a">
      </div>
      <canvas id="result-canvas" style="display:block;width:100%;max-height:220px;background:#0b1610"></canvas>
    </div>

    <div class="problem-panel">
      <div class="panel-hdr">
        <div class="panel-title">問題点</div>
        <div class="filter-row">
          <span class="filter-label">悩み別：</span>
          <select id="filter-sel"></select>
        </div>
      </div>

      <div class="prim-card">
        <div class="prim-hdr">
          <span class="prim-label" id="prim-label">解析中...</span>
          <span class="status-chip unknown" id="prim-status">—</span>
        </div>
        <div class="prim-problem" id="prim-problem" style="margin-bottom:8px">—</div>
        <div class="hint-card">
          <div class="hint-label">改善ヒント</div>
          <div class="hint-text" id="prim-hint">—</div>
        </div>
      </div>

      <div class="chip-row" id="principle-chips"></div>
      <div id="result-detail"></div>
    </div>

  </div>
  <div class="result-actions">
    <button class="btn-primary" id="btn-another">▶ もう1球</button>
    <button class="btn-secondary" id="btn-retry">最初から</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5.1675469404/pose.js" crossorigin="anonymous"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
